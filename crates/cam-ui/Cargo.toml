[package]
name = "cam-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
egui.workspace = true
cam-app.workspace = true
# The scripting panel runs a script by calling the engine, never by spawning the binary (M10 T4b,
# D-M10-1): `cam-cli` is also the home of the operations the shell calls, and this is a
# workspace-internal edge rather than a new external one.
cam-cli.workspace = true
cam-geom.workspace = true
cam-import.workspace = true
cam-model.workspace = true
cam-move.workspace = true
cam-post.workspace = true
cam-sim.workspace = true
cam-store.workspace = true
cam-units.workspace = true
cam-view.workspace = true

[dev-dependencies]
egui = { workspace = true, features = ["default_fonts"] }
egui_kittest = { version = "0.37", features = ["wgpu"] }
image = { version = "0.25", default-features = false, features = ["png"] }
cam-geom.workspace = true
cam-import.workspace = true
cam-model.workspace = true
cam-move.workspace = true
cam-sim.workspace = true
cam-store.workspace = true
cam-units.workspace = true
