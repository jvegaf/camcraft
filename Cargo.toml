[workspace]
resolver = "2"
members = [
    "crates/cam-units",
    "crates/cam-geom",
    "crates/cam-move",
    "crates/cam-model",
    "crates/cam-store",
    "crates/cam-post",
    "crates/cam-toolpath",
    "crates/cam-cli",
    "crates/cam-app",
    "crates/cam-view",
    "crates/cam-ui",
    "crates/cam-desktop",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.80"
license = "MIT"
publish = false

[workspace.dependencies]
cam-units = { path = "crates/cam-units" }
cam-geom = { path = "crates/cam-geom" }
cam-move = { path = "crates/cam-move" }
cam-model = { path = "crates/cam-model" }
cam-store = { path = "crates/cam-store" }
cam-post = { path = "crates/cam-post" }
cam-toolpath = { path = "crates/cam-toolpath" }
cam-app = { path = "crates/cam-app" }
cam-view = { path = "crates/cam-view" }
cam-ui = { path = "crates/cam-ui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.32", features = ["bundled"] }
proptest = "1"
egui = "0.37"
eframe = "0.37"
