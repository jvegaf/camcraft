[workspace]
resolver = "2"
members = [
    "crates/cam-units",
    "crates/cam-geom",
    "crates/cam-move",
    "crates/cam-model",
    "crates/cam-ops",
    "crates/cam-store",
    "crates/cam-post",
    "crates/cam-sim",
    "crates/cam-cli",
    "crates/cam-app",
    "crates/cam-export",
    "crates/cam-import",
    "crates/cam-excellon",
    "crates/cam-gerber",
    "crates/cam-view",
    "crates/cam-ui",
    "crates/cam-desktop",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.80"
license = "MIT"
publish = false

[workspace.dependencies]
cam-units = { path = "crates/cam-units" }
cam-geom = { path = "crates/cam-geom" }
cam-move = { path = "crates/cam-move" }
cam-model = { path = "crates/cam-model" }
cam-ops = { path = "crates/cam-ops" }
cam-store = { path = "crates/cam-store" }
cam-post = { path = "crates/cam-post" }
cam-sim = { path = "crates/cam-sim" }
cam-app = { path = "crates/cam-app" }
cam-import = { path = "crates/cam-import" }
cam-excellon = { path = "crates/cam-excellon" }
cam-gerber = { path = "crates/cam-gerber" }
cam-export = { path = "crates/cam-export" }
cam-cli = { path = "crates/cam-cli" }
cam-view = { path = "crates/cam-view" }
cam-ui = { path = "crates/cam-ui" }
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` makes JSON parsing exact: without it a stored coordinate can come back one ULP
# away, which breaks the documented lossless round trip of `c2d/document@1` (M0 A3).
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.32", features = ["bundled"] }
# Already in the tree as `zip`'s DEFLATE backend; promoted for PDF `FlateDecode` and PNG `IDAT` (M3
# D-M3-1). It is the only dependency the importer adds.
flate2 = "1"
proptest = "1"
egui = "0.37"
eframe = "0.37"
# The window's file dialog, and the only platform-facing piece of opening a document: the shell emits
# the intent and the host answers with a path, so the editor crate stays free of the desktop toolkit
# (shell-open-document S1, taking the decision `odd/tasks/004-m3-import.md:113` had deferred).
rfd = "0.15"
criterion = { version = "0.5", features = ["html_reports"] }
