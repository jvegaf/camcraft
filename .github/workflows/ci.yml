name: CI

# Un solo tronco, `master`. Un push o un pull request corre `gate` y nada más: los tests unitarios
# del frontend (`pnpm test`, que es `vitest run`) y las suites de Rust del workspace. El gate
# documental/claim completo queda para `scripts/check.sh` en local; acá costaría minutos que una
# integración no tiene por qué gastar.
#
# `parity` y `bench` miden el corpus y cuestan minutos, así que no se disparan solos: corren sólo
# por `workflow_dispatch`, a pedido. Los nombres de job `gate`, `parity` y `bench` se mantienen
# porque el nombre del job es el status context: renombrar uno borra en silencio cualquier requisito
# futuro construido sobre él. Hoy no hay ningún check requerido, y `parity`/`bench` no pueden
# requerirse mientras sean dispatch-only.

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # La forma del workflow, antes de instalar nada: es rápido y es el fallo barato. El test vive
      # en `scripts/tests/ci-workflow.sh` y también lo corre `just test-tooling` en local.
      - name: Check workflow shape (one trunk, dispatch-only parity/bench, job names)
        run: bash scripts/tests/ci-workflow.sh

      # El gate de estados de `docs/GAPS_CAMCRAFT.md` §3: un hallazgo que pierde su id, su estado o su
      # cita resoluble falla. Es barato (bash + `python3` de la biblioteca estándar, como
      # `check-docs.sh`), así que corre antes de instalar pnpm o Rust y no depende del toolchain.
      - name: Check GAPS findings keep id, state and citation
        run: bash scripts/check-gaps-states.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # `styled-system/` está en .gitignore y los tests importan `styled-system/*`; sin el codegen
      # la suite no resuelve sus imports. Es setup, no un gate.
      - name: Generate Panda CSS
        run: pnpm codegen

      - name: Run frontend tests
        run: pnpm test

      # Las suites de Rust del workspace entero, no sólo el paquete host: cada crate del workspace
      # (`cam-import`, `cam-geom`, `cam-excellon`, `cam-ops`, …) corre en `gate`, igual que en
      # `just test-rust-workspace`. `cam-ui` y `cam-desktop` quedan fuera porque necesitan un
      # display para compilar y correr, y un runner de CI no lo tiene.
      - name: Run Rust tests
        run: cargo test --workspace --exclude cam-ui --exclude cam-desktop

  # Deuda anotada donde el código va a volver: el paso de scope que decida si medir tiene que
  # degradar a medir cuando `github.event.before` no es alcanzable (push forzado, rama recién creada,
  # base ausente). Un `git diff "$before" "$sha"` sobre un commit que no está en el clon aborta el
  # paso bajo `set -e` y el job falla en vez de medir. El paso original se eliminó con la migración
  # (`7522996`, junto con su `fetch-depth: 0`); no se arregló.
  parity:
    name: parity
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Parity gate (migration placeholder)
        run: |
          echo "Parity corpus gate deshabilitado durante migración Tauri."
          echo "Se reactivará cuando el pipeline CAM/prev se reintegre."

  # Corre de verdad los dos arneses de regresión de `src-tauri/crates/*/benches/check_regression.sh`
  # (S4/T2) más la medición reproducible de la placa grande de NCC (S2/T1).
  #
  # Política de hardware: los baselines commiteados son tiempos ABSOLUTOS medidos en un i7-10875H de
  # 16 CPUs (`odd/reports/ncc-regression.md`). Criterion compara absolutos, así que un runner de otra
  # clase puede desplazarlos en bloque y producir rojos que no son regresiones de código. No hay
  # evidencia de que `ubuntu-latest` sea ese host, así que este job no afirma equivalencia:
  #   - sigue siendo dispatch-only: un humano decide cuándo pagar los minutos y desde qué host;
  #   - imprime `nproc`/CPU/`rustc` antes de medir, para que el log haga auditable la comparación;
  #   - corre los arneses con su umbral del 10 % y falla con la regresión: sin `continue-on-error`,
  #     sin filtrar benches y sin `|| true`;
  #   - un desplazamiento uniforme de TODOS los benches contra un host de otra clase es un rojo
  #     honesto de «baseline no comparable acá»: se resuelve despachando en el host de referencia o
  #     re-baselinando en ese runner, nunca ensanchando el umbral. Un rojo concentrado en un bench
  #     —hoy `ops/ncc_unite_corpus_large_plate`, +422 %…+457 % por la regresión de T1— es real en
  #     cualquier host y bloquea. T4 lo arregla; este job no lo esconde.
  bench:
    name: bench
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      # El host es parte de la medición: el baseline no es portable entre clases de CPU.
      - name: Record host identity
        run: |
          echo "nproc: $(nproc)"
          lscpu | grep -E 'Model name|^CPU\(s\)|Thread|Core|Socket' || true
          rustc --version
          cargo --version

      # Medición reproducible de S2/T1 publicada antes de los gates: si un gate falla, el log ya
      # tiene el split unite/fill/clip de la placa grande. No es el gate; el gate es Criterion.
      - name: Publish NCC large-plate measurement (T1)
        run: cargo test -p cam-ops --release --test ncc measure_ncc_large_plate_kicad_large_pours -- --ignored --nocapture

      # Los dos arneses de S4/T2, tal como se corren en local. Fallan si el baseline commiteado no
      # cubre un bench o si Criterion imprime «Performance has regressed».
      - name: Regression gate cam-geom
        run: bash src-tauri/crates/cam-geom/benches/check_regression.sh

      - name: Regression gate cam-ops (incluye ops/ncc_unite_corpus_large_plate)
        run: bash src-tauri/crates/cam-ops/benches/check_regression.sh
