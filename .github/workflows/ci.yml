name: CI

# Stack en migración: Tauri 2 + Svelte 5 + Panda CSS.
# Los nombres de jobs `gate`, `parity` y `bench` se mantienen por compatibilidad
# con protección de rama; su contenido se adapta al stack actual.

on:
  push:
    branches: [ dev, feat/tauri ]
  pull_request:
    branches: [ master, dev ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run project gates
        run: ./scripts/check.sh

  # Deuda anotada donde el código va a volver: el paso de scope que decida si medir tiene que
  # degradar a medir cuando `github.event.before` no es alcanzable (push forzado, rama recién creada,
  # base ausente). Un `git diff "$before" "$sha"` sobre un commit que no está en el clon aborta el
  # paso bajo `set -e` y el job falla en vez de medir. El paso original se eliminó con la migración
  # (`7522996`, junto con su `fetch-depth: 0`); no se arregló.
  parity:
    name: parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Parity gate (migration placeholder)
        run: |
          echo "Parity corpus gate deshabilitado durante migración Tauri."
          echo "Se reactivará cuando el pipeline CAM/prev se reintegre."

  bench:
    name: bench
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Bench gate (migration placeholder)
        run: |
          echo "Benchmarks deshabilitados durante migración Tauri."
          echo "Se reactivarán cuando el pipeline CAM/prev se reintegre."
